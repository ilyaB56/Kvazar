services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && python -m src.seed && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    environment: &app_env
      DATABASE_URL: postgresql+psycopg2://erp:erp@db:5432/erp
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      SECRETS_KEY: change-me-fernet-key
      CORS_ORIGINS: '["http://localhost:5173"]'
      # прод обязан задать собственный пароль сид-админа (security-plan P0-5)
      # SEED_ADMIN_PASSWORD: change-me-in-production
      # бэкапы/обновления (updates-and-backups-spec); BACKUP_KEY ротируется в проде
      BACKUP_KEY: KbPbCqtmutVQDaMHVvNSte7n0_F8VkalqpAkmWed5js=
      BACKUP_DIR: /backups
      BACKUP_RETENTION: "3"
      BACKUP_SCHEDULE: "03:00"
      UPDATE_MANIFEST_URL: file:///app/deploy/test-manifest.json
    ports:
      # наружу API не публикуем — только с localhost и через web-прокси (security-p0 п.5)
      - "127.0.0.1:8000:8000"
    volumes:
      - erp_backups:/backups
      # дев-режим file:// для UPDATE_MANIFEST_URL (прод использует http-URL)
      - ./deploy:/app/deploy:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A src.worker.celery_app worker --loglevel=info -Q integrations,default
    environment: *app_env
    volumes:
      - erp_backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A src.worker.celery_app beat --loglevel=info
    environment: *app_env
    volumes:
      - erp_backups:/backups
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
      - "443:443"
    environment:
      # WEB_TLS=1 + сертификаты в ./deploy/certs (tls.crt/tls.key) — HTTPS-режим
      WEB_TLS: ${WEB_TLS:-0}
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
  erp_backups:

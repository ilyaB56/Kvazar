[project]
name = "custom-erp"
version = "0.1.0"
description = "Собственная ERP: модульный монолит с плагинами и интеграционной платформой"
requires-python = ">=3.11"
dependencies = [
    # xlsx-экспорт браузера таблиц (devtools О1: Excel в v1)
    "openpyxl>3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "pyotp>=2.9",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.1,<5",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "cryptography>=42.0",
    "httpx>=0.27",
    "croniter>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ADR-001: сетевые библиотеки разрешены только в коннекторах интеграционного модуля.
# Набор правил задан явно (классический дефолт ruff + TID251), чтобы не зависеть
# от расширения дефолтов между версиями ruff.
select = ["E4", "E7", "E9", "F", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Сетевой импорт разрешён только в src/modules/integrations/connectors/ (ADR-001)"
"requests".msg = "Сетевой импорт разрешён только в src/modules/integrations/connectors/ (ADR-001)"
"urllib.request".msg = "Сетевой импорт разрешён только в src/modules/integrations/connectors/ (ADR-001)"
"aiohttp".msg = "Сетевой импорт разрешён только в src/modules/integrations/connectors/ (ADR-001)"
"socket".msg = "Сетевой импорт разрешён только в src/modules/integrations/connectors/ (ADR-001)"
"smtplib".msg = "Сетевой импорт разрешён только в src/modules/integrations/connectors/ (ADR-001; SMTP-коннектор — этап C)"

[tool.ruff.lint.per-file-ignores]
# Слой коннекторов — единственное место с правом сетевого взаимодействия (ADR-001)
"src/modules/integrations/connectors/**" = ["TID251"]
# Тесты обращаются к запущенному API намеренно
"tests/**" = ["TID251"]
# Инфраструктурное исключение ADR-001: проверка манифеста обновлений ходит в сеть
"src/core/update/**" = ["TID251"]
# TOTP-слой ядра — единая точка pyotp (этап C)
"src/core/totp.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[package]
name = "kvazar-shell"
version = "1.0.0"
description = "Квазар — нативное окно (оболочка) для веб-интерфейса ERP"
authors = ["IlyaB56"]
edition = "2021"
default-run = "kvazar-shell"

# Оболочка — обёртка над существующим веб-интерфейсом (tauri-shell-spec §4):
# только адрес, окно, трей, health-зонд. Никакой бизнес-логики ERP.

[lib]
name = "kvazar_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kvazar-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

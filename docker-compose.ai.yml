# ИИ-профиль коробки (box-installer-spec §3.7, этап A): override поверх
# docker-compose.box.yml — поднимается только с чекбоксом «ИИ-ассистент»
# (RAM ≥ 8 ГБ; на ≤ 8 ГБ установщик не предлагает — инцидент 2026-09-11).
# Использование:
#   docker compose -f docker-compose.box.yml -f docker-compose.ai.yml \
#     --project-name quasar up -d
# + .env: AI_PROVIDER=ollama, AI_CHAT_MODEL (3b на слабом железе)
services:
  ollama:
    restart: unless-stopped
    image: ollama/ollama:latest
    # Дешёвый хост: одна модель в памяти, один параллельный запрос —
    # иначе генерация с RAG-контекстом съедает память VM и роняет движок
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    # GPU — опционально (параметризуем из .env: NVIDIA driver при наличии)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["ai"]

volumes:
  ollama_models:

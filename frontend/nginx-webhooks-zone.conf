# P1 security-plan п.8: зона rate limit для публичного приёма вебхуков
# (30 r/m с burst 10 на endpoint). Подключается на уровне http{} основного
# конфига nginx; сам limit_req — в location /api/v1/integrations/hooks/
# (default.conf). Провайдер ретраит нотификации вразумительно (ЮKassa —
# раз в несколько минут); этого достаточно и режет флуд.
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/m;

# HTTP-режим по умолчанию (dev): WEB_TLS=0
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: переразрешение имени api (IP контейнера меняется
    # после перезапусков движка — nginx кэширует upstream при старте).
    # valid=60s: IP меняется только при наших же up -d (поднимаем и web),
    # а частые резолвы ловили мусорные ответы Docker DNS после сбоев
    # движка («wrong ident» → 502 на любой запрос) — реже спрашиваем,
    # меньше гонок; timeout отсекает зависшие запросы.
    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 5s;

    # ИИ-эндпоинты: генерация на локальной LLM (ollama) идёт минуты —
    # дефолтного proxy_read_timeout 60s не хватает: nginx возвращал 504,
    # бэкенд тем временем дописывал ответ в сессию («ответ появляется
    # после перезагрузки»). 360s > коннекторных 300s — браузер видит
    # реальный ответ/ошибку бэкенда, а не обрыв прокси.
    location /api/v1/ai/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # Один origin: API проксируется внутрь, CORS не нужен
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # вебхуки эквайринга: тот же апстрим, но с rate limit
    location /api/v1/integrations/hooks/ {
        limit_req zone=webhooks burst=10 nodelay;
        limit_req_status 429;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # инфраструктурная проверка живости API (для мониторинга/приёмки)
    location = /health {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # Хэшированные ассеты Vite: содержимое = имя файла, кэшируем навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-маршруты; index.html всегда переспрашивается (ETag отдаст 304),
    # чтобы после обновления пользователи видели новую версию, а не кэш
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
